version: "3.9"
services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  backend:
    build: ./backend
    environment:
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - OPENROUTER_MODEL_ID=${OPENROUTER_MODEL_ID:-openai/gpt-oss-120b:free}
      - OPENROUTER_MODEL_CANDIDATES=${OPENROUTER_MODEL_CANDIDATES:-openai/gpt-oss-20b:free}
      - OPENROUTER_HTTP_REFERER=${OPENROUTER_HTTP_REFERER:-http://localhost:5173}
      - OPENROUTER_APP_NAME=${OPENROUTER_APP_NAME:-IronTest QA Agent}
      - MONGODB_URI=${MONGODB_URI:-mongodb://mongo:27017}
      - MONGODB_DB_NAME=${MONGODB_DB_NAME:-irontest}
      - MONGODB_COLLECTION=${MONGODB_COLLECTION:-executions}
      - JIRA_EMAIL=${JIRA_EMAIL}
      - JIRA_API_TOKEN=${JIRA_API_TOKEN}
    volumes:
      - ./backend/data:/app/data
    ports:
      - "8000:8000"
    depends_on:
      - mongo

  frontend:
    build: ./frontend
    environment:
      - VITE_API_BASE=http://localhost:8000
    depends_on:
      - backend
    ports:
      - "5173:5173"

volumes:
  mongo_data:
