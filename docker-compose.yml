version: "3.9"
services:
  backend:
    build: ./backend
    environment:
      - HUGGINGFACE_API_TOKEN=${HUGGINGFACE_API_TOKEN}
      - HUGGINGFACE_MODEL_ID=${HUGGINGFACE_MODEL_ID:-meta-llama-3-8b-instruct}
    ports:
      - "8000:8000"
  frontend:
    build: ./frontend
    environment:
      - VITE_API_BASE=http://backend:8000
    depends_on:
      - backend
    ports:
      - "5173:5173"
