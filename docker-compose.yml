# Local stack: API, Postgres, and the Vite dev server.
#
# The Docker test runner needs a Docker socket, which is why the API mounts
# one. Only do this locally: it grants the container control of your daemon.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: irontest
      POSTGRES_PASSWORD: irontest
      POSTGRES_DB: irontest
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U irontest"]
      interval: 5s
      retries: 10

  api:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://irontest:irontest@db:5432/irontest
      ENVIRONMENT: development
      FRONTEND_URL: http://localhost:5173
      TEST_RUNNER: docker
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      # Lets the API drive the host daemon for sandboxed test runs.
      - /var/run/docker.sock:/var/run/docker.sock

  web:
    image: node:20-slim
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_API_BASE: http://localhost:8000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  pgdata:
